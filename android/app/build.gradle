plugins {
    id 'com.android.application'
}

android {
    namespace 'org.dc4engine'
    compileSdk 36
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'org.dc4engine'
        minSdk 21          // Android 5.0 (Lollipop)+
        targetSdk 36       // Android 16 (Baklava)
        versionCode 8
        versionName '0.6.1'
        externalNativeBuild {
            cmake {
                // Scene save/lifecycle snapshots use C++17 exceptions.
                cppFlags '-std=c++17 -O2'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        prefab false
        buildConfig true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ['**/libc++_shared.so']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}


// dc4core lives at the repo root, two levels above android/app/.
gradle.projectsEvaluated {
    // nothing to do; the CMake path below reaches the sources directly
}
