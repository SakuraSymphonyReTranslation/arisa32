plugins {
    id 'com.android.application'
}

def arisaAbi = providers.gradleProperty('arisaAbi').orNull
if (arisaAbi != null && !(arisaAbi in ['arm64-v8a', 'armeabi-v7a'])) {
    throw new GradleException('arisaAbi must be arm64-v8a or armeabi-v7a')
}

android {
    namespace 'org.dc4engine'
    compileSdk 36
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'org.dc4engine'
        manifestPlaceholders = [appLabel: '@string/app_name']
        minSdk arisaAbi == null ? 21 : 23
        targetSdk 36       // Android 16 (Baklava)
        versionCode 20
        versionName '0.7.2'
        testInstrumentationRunner 'org.dc4engine.UpdateDialogChecks'
        externalNativeBuild {
            cmake {
                // Scene save/lifecycle snapshots use C++17 exceptions.
                cppFlags '-std=c++17 -O2'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
        ndk { abiFilters.addAll(arisaAbi == null ? ['arm64-v8a', 'armeabi-v7a'] : [arisaAbi]) }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        prefab false
        buildConfig true
    }

    sourceSets.androidTest.assets.srcDir '../../docs/releases'

    packagingOptions {
        jniLibs {
            useLegacyPackaging = arisaAbi == null
            pickFirsts += ['**/libc++_shared.so']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}


// dc4core lives at the repo root, two levels above android/app/.
gradle.projectsEvaluated {
    // nothing to do; the CMake path below reaches the sources directly
}
